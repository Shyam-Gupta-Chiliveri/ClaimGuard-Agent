name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"        # weekly retrain + drift check, Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: "Why retrain (e.g. triggered by the n8n drift monitor)"
        required: false
        default: "manual"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOKY_MAX_CPU_COUNT: "2"

jobs:
  quality:
    name: lint · data contracts · train · gate · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Data contracts
        run: python -m pipeline.validate
      - name: Train + quality gate (fails the build if the gate fails)
        run: python -m ml.regionalklasse
      - name: Anomaly model
        run: python -m ml.anomaly
      - name: Drift check
        run: python -m ml.drift
      - name: Analysis report
        run: python -m pipeline.report
      - name: Tests
        run: python -m pytest
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          card = pathlib.Path("reports/model_card_regionalklasse.md")
          drift = pathlib.Path("reports/drift.json")
          if card.exists():
              print(card.read_text())
          if drift.exists():
              d = json.loads(drift.read_text())
              print(f"\n## Drift: **{d['status']}** ({d['reference']} vs {d['current']})\n")
              print("| feature | PSI | status |\n|---|---|---|")
              for f in d["features"]:
                  print(f"| {f['feature']} | {f['psi']} | {f['status']} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-artifacts
          path: |
            models/registry
            reports

  docker:
    name: build image · smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t claimguard:ci .
      - name: Smoke test
        run: |
          docker run -d --name cg -p 8000:8000 claimguard:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/overview | head -c 300; echo
          curl -fs -X POST http://127.0.0.1:8000/api/claims/score -H 'content-type: application/json' \
            -d '{"days_after_policy_start":5,"description_matches_damage":"no","document_manipulated":"yes"}' | grep -q '"band":"red"'
          curl -fs -o /dev/null http://127.0.0.1:8000/
          docker logs cg | tail -20

  deploy:
    name: deploy to Oracle Cloud VM
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets
        id: check
        run: echo "ready=${{ secrets.ORACLE_HOST != '' && secrets.ORACLE_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: Pull, rebuild and restart over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.ORACLE_APP_DIR || '~/claimguard' }}
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
            sleep 15
            curl -fs http://127.0.0.1:8000/api/health
      - name: Skip (no secrets)
        if: steps.check.outputs.ready != 'true'
        run: echo "Set ORACLE_HOST and ORACLE_SSH_KEY repository secrets to enable automatic deployment."
